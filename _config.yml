title: Australia 2028 eclipse — trip research
description: Sourced notes on where to stand for the total solar eclipse of 22 July 2028.

plugins:
  - jekyll-relative-links

# Rewrites lodging-dubbo.md -> lodging-dubbo.html so the cross-links between
# these documents keep working without editing the source files.
relative_links:
  enabled: true
  collections: false

# No `theme:` — the public and private sites share site/style.css and a local
# _layouts/default.html, so the dark-mode toggle behaves identically on both.

defaults:
  - scope: { path: "" }
    values: { layout: "default" }

github_repo: rageling/aus2028-eclipse
